<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rutas de Tacna | Mapa Interactivo</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <link rel="apple-touch-icon" href="icon-512.png" />

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos del Proyecto -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Contenedor del Mapa -->
  <main id="map" role="region" aria-label="Mapa de rutas urbanas"></main>

  <!-- Botón Flotante de Geolocalización (GPS) -->
  <button id="locateBtn" class="gps-btn" title="Mi ubicación GPS" aria-label="Localizar mi posición">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
    </svg>
  </button>

  <!-- Panel Flotante de Rutas -->
  <aside class="routes-panel" id="routesPanel" aria-label="Control de rutas de transporte">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-icon" aria-hidden="true">
          <!-- Icono SVG de Autobús -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v6"></path>
            <path d="M15 6v6"></path>
            <path d="M2 12h19.6"></path>
            <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.2 6 18.2 6H5.8C4.8 6 3.9 6.8 3.6 7.8l-1.4 5c-.1.4-.2.8-.2 1.2 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3"></path>
            <circle cx="7" cy="18" r="2"></circle>
            <path d="M9 18h5"></path>
            <circle cx="16" cy="18" r="2"></circle>
          </svg>
        </div>
        <span>Rutas de Tacna</span>
        <span class="badge-count" id="activeBadge" aria-live="polite">0 activas</span>
      </div>

      <button class="btn-toggle-collapse" id="btnCollapse" title="Minimizar panel" aria-label="Minimizar o expandir panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
    </div>

    <div class="panel-content" id="panelContent">
      <!-- Botones de Acción Global -->
      <div class="global-actions">
        <button class="btn-action" id="btnEnableAll">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Activar todas
        </button>
        <button class="btn-action" id="btnDisableAll">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Desactivar todas
        </button>
      </div>

      <!-- Lista dinámica de rutas generadas desde el GeoJSON -->
      <div class="routes-list" id="routesList" role="list">
        <!-- Generado dinámicamente por script.js -->
      </div>

      <footer class="panel-footer">
        Haz clic en una ruta para activarla/desactivarla o en 🎯 para enfocarla
      </footer>
    </div>
  </aside>

  <!-- Dependencias JavaScript de Terceros -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lógica Principal de la Aplicación -->
  <script src="script.js"></script>
</body>
</html>
